<div class="dashboard-layout">
  <nav class="sidenav" [class.open]="menuOpen">
    <div class="nav-header">
      <div class="nav-logo">CRM</div>
      <div class="nav-user">
        <span class="nav-nombre">{{ nombre }}</span>
        <span class="badge" [ngClass]="'badge-'+rol">{{ rol }}</span>
      </div>
    </div>
    <ul class="nav-menu">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="'/dashboard/'+item.path"
           routerLinkActive="active"
           (click)="menuOpen=false">
          <span class="nav-icon">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
    <button class="nav-logout" (click)="logout()">🚪 Cerrar sesión</button>
  </nav>

  <main class="main-content">
    <header class="top-bar">
      <button class="menu-toggle" (click)="menuOpen = !menuOpen">☰</button>
      <span class="page-title">Sistema CRM</span>
    </header>
    <div class="content-body">
      <router-outlet />
    </div>
  </main>

  <div class="overlay" *ngIf="menuOpen" (click)="menuOpen=false"></div>
</div>
